<title>Nandini's Birthday Run</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
:root {
  --bg-1: #2b1f3a;
  --bg-2: #4a2b52;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: radial-gradient(circle at 50% 0%, var(--bg-2), var(--bg-1) 70%);
  color: #f7e9f2;
  font-family: "Press Start 2P", "Courier New", monospace;
  overflow: hidden;
  -webkit-text-size-adjust: 100%;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 6px;
}

/* The canvas sizes itself to a whole-number multiple of 320x180 (see
   layout() in game.js); the stage just wraps and centres it. */
#stage {
  position: relative;
  line-height: 0;
}

#game {
  display: block;
  background: #8fd3ff;
  box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45), 0 0 0 3px rgba(255, 255, 255, 0.14);
  touch-action: none;
  /* Keep the upscaled art blocky instead of letting the browser smooth it. */
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}

#footnote {
  margin: 0;
  font-size: 8px;
  line-height: 1.6;
  letter-spacing: 0.5px;
  opacity: 0.55;
  text-align: center;
}

/* On-screen controls: only for touch devices. */
#touch-controls {
  display: none;
  position: absolute;
  inset: auto 0 0 0;
  padding: 0 14px 14px;
  justify-content: space-between;
  align-items: flex-end;
  pointer-events: none;
}

#touch-controls .pad { display: flex; gap: 12px; }

.tbtn {
  pointer-events: auto;
  width: 68px;
  height: 68px;
  border: 3px solid rgba(255, 255, 255, 0.55);
  background: rgba(30, 20, 45, 0.42);
  color: #fff;
  font-family: inherit;
  font-size: 14px;
  backdrop-filter: blur(2px);
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}

.tbtn:active { background: rgba(255, 255, 255, 0.32); transform: scale(0.94); }
.tbtn.jump { width: 86px; height: 86px; font-size: 10px; }

@media (hover: none) and (pointer: coarse) {
  #touch-controls { display: flex; }
  #footnote { display: none; }
}

/* On a phone held upright, turn the whole stage sideways so the game is always
   landscape. The player just turns the device; the picture is already the right
   way round. Rotating the stage rather than asking the browser to lock the
   orientation is what makes this work on iOS, where the lock API does nothing.
   The touch buttons live inside the stage, so they come round with it.

   Only for screens too narrow to hold the game upright — a tablet in portrait
   has the width already, and turning its picture sideways would just be rude.
   Keep this selector in step with PORTRAIT_PHONE in js/game.js. */
@media (hover: none) and (pointer: coarse) and (orientation: portrait) and (max-width: 700px) {
  #stage {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) rotate(90deg);
  }
}
</style>

<div id="stage">
  <canvas id="game" width="640" height="360" aria-label="Nandini's Birthday Run game screen"></canvas>

  <div id="touch-controls" aria-hidden="true">
    <div class="pad">
      <button id="btn-left" class="tbtn" type="button">&#9664;</button>
      <button id="btn-right" class="tbtn" type="button">&#9654;</button>
    </div>
    <button id="btn-jump" class="tbtn jump" type="button">JUMP</button>
  </div>
</div>

<p id="footnote">ARROWS / A-D MOVE &middot; SPACE JUMP &middot; R RESTART &middot; M MUTE</p>

/* Turn an ASCII map into the shapes the game actually simulates. Runs of solid
 * tiles are merged into as few rectangles as possible: fewer rectangles means
 * fewer internal edges for the player to snag on while running along a floor. */
function buildLevel(def) {
  const rows = def.rows;
  const h = rows.length;
  const w = rows[0].length;
  const solidAt = (x, y) => x >= 0 && x < w && y >= 0 && y < h && rows[y][x] === '#';

  // Greedy merge: horizontal runs first, then stack identical runs vertically.
  const used = Array.from({ length: h }, () => new Array(w).fill(false));
  const solids = [];
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      if (!solidAt(x, y) || used[y][x]) continue;
      let x2 = x;
      while (x2 + 1 < w && solidAt(x2 + 1, y) && !used[y][x2 + 1]) x2++;
      let y2 = y;
      for (;;) {
        const ny = y2 + 1;
        if (ny >= h) break;
        let full = true;
        for (let i = x; i <= x2; i++) if (!solidAt(i, ny) || used[ny][i]) { full = false; break; }
        if (!full) break;
        y2 = ny;
      }
      for (let j = y; j <= y2; j++) for (let i = x; i <= x2; i++) used[j][i] = true;
      solids.push({ x: x * TILE, y: y * TILE, w: (x2 - x + 1) * TILE, h: (y2 - y + 1) * TILE });
    }
  }

  const spikes = [];
  const coins = [];
  const checkpoints = [];
  let spawn = { x: TILE, y: 0 };
  let cake = null;

  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const ch = rows[y][x];
      const px = x * TILE;
      const py = y * TILE;
      if (ch === '^') {
        // Forgiving hitbox: only the upper part of the tile, inset from the sides.
        spikes.push({ x: px + 4, y: py + 18, w: TILE - 8, h: TILE - 18, dir: 'up', tx: px, ty: py });
      } else if (ch === 'v') {
        spikes.push({ x: px + 4, y: py, w: TILE - 8, h: TILE - 18, dir: 'down', tx: px, ty: py });
      } else if (ch === '*') {
        coins.push({ x: px + TILE / 2, y: py + TILE / 2, taken: false, seed: coins.length * 1.7 });
      } else if (ch === 'f') {
        checkpoints.push({ x: px + TILE / 2, y: py + TILE, active: false });
      } else if (ch === 'P') {
        spawn = { x: px + TILE / 2, y: py + TILE };
      } else if (ch === 'c') {
        cake = { x: px + TILE / 2, y: py + TILE };
      }
    }
  }

  return {
    ...def,
    cols: w,
    rowCount: h,
    width: w * TILE,
    height: h * TILE,
    solids,
    spikes,
    coins,
    checkpoints,
    spawn,
    cake,
    // Anything below this line has fallen out of the world.
    deathY: h * TILE + 220,
  };
}
</script>
<script>
/* Pixel-art rendering.
 *
 * Everything is drawn into a 640x360 buffer where one buffer pixel is one art
 * pixel, then that buffer is blown up by a whole-number factor with smoothing
 * off. So all drawing here happens on a whole-pixel grid: no curves, no
 * anti-aliasing, no fractional coordinates.
 *
 * ART converts world pixels (what the physics uses) into art pixels. At 1.0
 * they are the same, so a 40px world tile is 40 art pixels and Nandini's
 * 28x40 hitbox sits under a 42x48 sprite.
 */
const ART = 1;
const ATILE = TILE * ART;          // 40
const aw = (v) => Math.round(v * ART);

const PAL = {
  T: '#ffd84d',   // gold
  W: '#ffffff',
  g: '#6b7285',   // spike body
  l: '#aab2c4',   // spike lit edge
  n: '#3f4454',   // spike shaded edge
  I: '#ff8fb1',   // icing
  i: '#e0699a',   // icing shade
  A: '#f6d9b0',   // sponge
  a: '#e0bd8e',   // sponge shade
  C: '#7fd4ff',   // candle
  F: '#ff9a3c',   // flame
  f: '#ffd84d',   // flame core
  P: '#f2f2f7',   // plate
  p: '#c9c9d6',
  b: '#ff5f8d',   // balloon
  X: '#6b4028',   // cake chocolate
  x: '#8a5738',   // cake chocolate light
  N: '#ffd24d',   // coin
  m: '#ffef9e',   // coin highlight
  M: '#c98f18',   // coin shade
  w: '#ffd0de',   // balloon highlight
  o: '#241a2b',   // outline
};


/* 4x4 ordered dither. Used for the sky band transitions and the depth
 * falloff, which is how the reference art blends colours without gradients. */
const BAYER = [
  [0, 8, 2, 10],
  [12, 4, 14, 6],
  [3, 11, 1, 9],
  [15, 7, 13, 5],
];

function rgbOf(hex) {
  if (hex[0] !== '#') {
    const m = hex.match(/\d+/g);
    return [+m[0], +m[1], +m[2]];
  }
  return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
}

/* Deterministic per-tile noise: the same tile always gets the same speckles,
 * so nothing crawls as the camera moves. */
function rnd(x, y, salt) {
  let n = (x * 374761393 + y * 668265263 + salt * 1274126177) | 0;
  n = Math.imul(n ^ (n >>> 13), 1274126177);
  return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
}

const px = (ctx, x, y, w, h, color) => { ctx.fillStyle = color; ctx.fillRect(x, y, w, h); };

/* A filled circle snapped to the pixel grid. */
function disc(ctx, cx, cy, r, color) {
  ctx.fillStyle = color;
  for (let y = -r; y <= r; y++) {
    const w = Math.round(Math.sqrt(r * r - y * y));
    ctx.fillRect(cx - w, cy + y, w * 2 + 1, 1);
  }
}

/* Draw once into an offscreen canvas and reuse it every frame. With outline
 * set, a 1px dark border is traced around the result so the props match the
 * character art, which is outlined the same way. */
function bake(w, h, draw, outline = true, outlineColor = PAL.o) {
  const pad = outline ? 1 : 0;
  const c = document.createElement('canvas');
  c.width = w + pad * 2;
  c.height = h + pad * 2;
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  g.save();
  g.translate(pad, pad);
  draw(g);
  g.restore();
  if (outline) {
    const W = c.width;
    const H = c.height;
    const d = g.getImageData(0, 0, W, H).data;
    const at = (x, y) => (x < 0 || y < 0 || x >= W || y >= H ? 0 : d[(y * W + x) * 4 + 3]);
    const ring = [];
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        if (at(x, y)) continue;
        if (at(x - 1, y) || at(x + 1, y) || at(x, y - 1) || at(x, y + 1)) ring.push([x, y]);
      }
    }
    g.fillStyle = outlineColor;
    for (const [x, y] of ring) g.fillRect(x, y, 1, 1);
  }
  return c;
}

/* ------------------------------------------------------------------ Nandini */

/* The character art is a spritesheet: nine 42x48 frames, feet flush with the
 * bottom of each cell. */
/* Asset paths go through one lookup so a single-file build can swap them for
 * inlined data URIs without touching the rest of the code. */
const ASSET_URLS = (typeof window !== 'undefined' && window.ASSET_URLS) || {};
const assetUrl = (name) => ASSET_URLS[name] || `assets/${name}.png`;

const SHEET = new Image();
SHEET.src = assetUrl('nandini');
const FRAMES = ['idle', 'blink', 'wave', 'kiss', 'walk1', 'run1', 'walk2', 'run2',
                'jump', 'fall', 'hurt', 'cheer'];
const FRAME_INDEX = Object.fromEntries(FRAMES.map((n, i) => [n, i]));
const RUN_CYCLE = ['run1', 'run2'];
let CELL_W = 42;
let CELL_H = 48;

/* Left alone, she blinks every few seconds and, after a longer wait, waves or
 * blows a kiss — so standing still never looks like a frozen screen. */
function idlePose(t) {
  if (t > 6) {
    const since = t - 6;
    if (since % 8 < 1.4) return Math.floor(since / 8) % 2 ? 'kiss' : 'wave';
  }
  const b = t % 3.4;
  if (b < 0.13 || (b > 0.26 && b < 0.39)) return 'blink';   // a double blink
  return 'idle';
}

function nandiniFrame(anim) {
  if (anim.victory) return 'cheer';
  if (anim.hurtFlash) return 'hurt';
  if (!anim.grounded) return anim.rising ? 'jump' : 'fall';
  if (anim.speed > 20) {
    const n = RUN_CYCLE.length;
    return RUN_CYCLE[((Math.floor(anim.runPhase) % n) + n) % n];
  }
  return idlePose(anim.idleTime || 0);
}

/* (cx, feetY) is the bottom-centre of her hitbox, in world pixels. */
function drawNandini(ctx, cx, feetY, facing, anim) {
  if (!SHEET.complete || !SHEET.naturalWidth) return;
  CELL_W = SHEET.naturalWidth / FRAMES.length;
  CELL_H = SHEET.naturalHeight;

  const pose = nandiniFrame(anim);
  const idx = FRAME_INDEX[pose];
  // a slow breath while she stands, so the sprite is never perfectly still
  const breath = (pose === 'idle' || pose === 'blink') && ((anim.idleTime || 0) % 1.8) > 0.9 ? -1 : 0;
  const x = aw(cx) - Math.floor(CELL_W / 2);
  const y = aw(feetY) - CELL_H + breath;
  ctx.save();
  if (facing < 0) {
    ctx.translate(x + CELL_W, y);
    ctx.scale(-1, 1);
    ctx.drawImage(SHEET, idx * CELL_W, 0, CELL_W, CELL_H, 0, 0, CELL_W, CELL_H);
  } else {
    ctx.drawImage(SHEET, idx * CELL_W, 0, CELL_W, CELL_H, x, y, CELL_W, CELL_H);
  }
  ctx.restore();
}

/* --------------------------------------------------------------- the props */

const SPR_FLOWER = bake(13, 13, (g) => {
  for (const [x, y] of [[6, 2], [10, 5], [8, 10], [4, 10], [2, 5]]) disc(g, x, y, 2, PAL.W);
  disc(g, 6, 6, 2, PAL.T);
});

/* A spent flower stays a flower, just drained of colour — a dark blob reads as
 * damage to the HUD rather than to Nandini. */
const SPR_FLOWER_OFF = bake(13, 13, (g) => {
  for (const [x, y] of [[6, 2], [10, 5], [8, 10], [4, 10], [2, 5]]) disc(g, x, y, 2, '#b9b2c6');
  disc(g, 6, 6, 2, '#8e869c');
});

/* Spinning coin, eight frames through a full turn.
 *
 * The width follows a cosine, so the face narrows to an edge and opens out
 * again at the physically right rate. What actually sells the rotation is the
 * highlight: it sweeps across the face and leans the other way once the far
 * side comes round, and the edge-on frames show a milled rim. Without those
 * cues a symmetric widen/narrow just reads as a throb. */
const COIN_OUT = '#7d4a10';
const COIN_RIM = '#dc9a17';
const COIN_FACE = '#ffcf33';
const COIN_LIGHT = '#ffe886';
const COIN_SHINE = '#fffbe4';

/* Chamfered rather than round: the reference coin is a chunky octagon. */
function coinRowHalf(y, hw) {
  const a = Math.abs(y);
  if (a > 8) return 0;
  return Math.max(1, hw - Math.max(0, a - 4));
}

function bakeCoinFrame(step) {
  const turn = Math.cos((step * Math.PI) / 4);
  const hw = Math.max(1, Math.round(8 * Math.abs(turn)));
  const back = turn < 0;
  const CX = 10;
  const CY = 10;
  return bake(20, 20, (g) => {
    for (let y = -8; y <= 8; y++) {
      const w = coinRowHalf(y, hw);
      px(g, CX - w, CY + y, w * 2, 1, COIN_RIM);
    }

    if (hw <= 2) {                       // edge on: a milled rim
      for (let y = -7; y <= 7; y += 3) px(g, CX - hw, CY + y, hw * 2, 1, COIN_OUT);
      px(g, CX - hw, CY - 8, 1, 17, COIN_LIGHT);
      return;
    }

    for (let y = -7; y <= 7; y++) {      // face
      const w = Math.max(1, coinRowHalf(y, hw) - 2);
      px(g, CX - w, CY + y, w * 2, 1, COIN_FACE);
    }
    if (hw >= 6) {
      for (let y = -4; y <= 4; y++) {
        const w = Math.max(1, coinRowHalf(y, hw) - 4);
        px(g, CX - w, CY + y, w * 2, 1, COIN_LIGHT);
      }
    }

    const lean = back ? -1 : 1;          // highlight sweeps the other way
    for (let k = 0; k <= 8; k++) {
      const y = k - 4;
      const w = coinRowHalf(y, hw) - 2;
      if (w < 1) continue;
      const want = CX - lean * Math.round((k - 4) * 0.85) - 1;
      const x = Math.max(CX - w, Math.min(CX + w - 2, want));
      px(g, x, CY + y, 2, 1, COIN_SHINE);
    }
  }, true, COIN_OUT);
}

const COIN_FRAMES = Array.from({ length: 8 }, (_, i) => bakeCoinFrame(i));
const SPR_COIN = COIN_FRAMES[0];

function balloon(color, highlight, string) {
  return bake(13, 20, (g) => {
    disc(g, 6, 6, 6, color);
    px(g, 5, 12, 3, 2, color);
    px(g, 6, 13, 1, 1, color);
    disc(g, 4, 4, 1, highlight);
    g.fillStyle = string;
    for (let i = 0; i < 6; i++) g.fillRect(6 + (i % 3 === 1 ? 1 : 0), 14 + i, 1, 1);
  });
}
const SPR_BALLOON = balloon(PAL.b, PAL.w, 'rgba(255,255,255,0.75)');
const SPR_BALLOON_OFF = balloon('#8d94a6', '#c3c9d6', 'rgba(200,200,210,0.5)');

/* Cake: chocolate tiers under pink icing with white drips, and three lit
 * candles — matching the goal cake in the design reference. */
function icingDrips(g, x, w, y, color) {
  for (let d = 0; d + 6 <= w; d += 6) {
    const h = 3 + ((d / 6) % 3);
    px(g, x + d + 1, y, 4, h, color);
    px(g, x + d + 2, y + h, 2, 1, color);
  }
}

const SPR_CAKE = bake(48, 58, (g) => {
  px(g, 2, 54, 44, 4, PAL.P);                  // plate
  px(g, 6, 52, 36, 2, PAL.p);

  px(g, 5, 36, 38, 16, PAL.X);                 // lower tier
  px(g, 5, 36, 38, 3, PAL.x);
  px(g, 4, 28, 40, 9, PAL.I);                  // lower icing
  px(g, 4, 28, 40, 2, '#ffb8cf');
  px(g, 4, 35, 40, 2, PAL.i);
  icingDrips(g, 4, 40, 37, PAL.W);

  px(g, 13, 15, 22, 13, PAL.X);                // upper tier
  px(g, 13, 15, 22, 3, PAL.x);
  px(g, 12, 8, 24, 8, PAL.I);                  // upper icing
  px(g, 12, 8, 24, 2, '#ffb8cf');
  icingDrips(g, 12, 24, 15, PAL.W);

  for (let i = 0; i < 3; i++) {                // candles
    const cx = 16 + i * 8;
    px(g, cx, 0, 3, 9, PAL.W);
    px(g, cx, 3, 3, 2, PAL.b);
  }
});

/* A pennant at the goal, so the finish reads at a glance. */
const SPR_FLAG = bake(18, 44, (g) => {
  px(g, 2, 0, 3, 44, '#d8d8e4');
  px(g, 2, 0, 1, 44, '#ffffff');
  for (let r = 0; r < 14; r++) {
    px(g, 5, 3 + r, 13 - Math.abs(r - 7), 1, r < 7 ? '#ff6ea6' : '#e8467f');
  }
});

function drawCake(ctx, x, baseY, t) {
  const bob = Math.floor(t * 2) % 2;
  const bx = aw(x) - Math.floor(SPR_CAKE.width / 2);
  const by = aw(baseY) - SPR_CAKE.height + 1 + bob;

  ctx.drawImage(SPR_FLAG, bx + SPR_CAKE.width + 2, aw(baseY) - SPR_FLAG.height + 1);
  ctx.drawImage(SPR_CAKE, bx, by);

  // three flames, flickering out of step with each other
  for (let i = 0; i < 3; i++) {
    const cx = bx + 17 + i * 8;
    const f = Math.floor(t * 8 + i * 1.7) % 3;
    px(ctx, cx - 1, by - 5 + (f === 1 ? 1 : 0), 3, 5, PAL.F);
    px(ctx, cx, by - 6 + (f === 1 ? 1 : 0), 1, 3, PAL.f);
    px(ctx, cx - 1 + (f === 2 ? 1 : 0), by - 7, 1, 1, PAL.f);
  }

  ctx.fillStyle = 'rgba(255,222,140,0.85)';
  for (let i = 0; i < 5; i++) {
    if ((Math.floor(t * 3) + i) % 4 === 0) continue;
    const a = (i / 5) * Math.PI * 2 + t * 0.7;
    ctx.fillRect(bx + 24 + Math.round(Math.cos(a) * 22), by + 6 + Math.round(Math.sin(a) * 16), 2, 2);
  }
}

function drawCoin(ctx, c, t) {
  const spr = COIN_FRAMES[Math.floor(t * 11 + c.seed * 3) % COIN_FRAMES.length];
  ctx.drawImage(spr, aw(c.x) - Math.floor(spr.width / 2), aw(c.y) - Math.floor(spr.height / 2));
}

function drawCheckpoint(ctx, c, t) {
  const x = aw(c.x);
  const y = aw(c.y);
  const sway = Math.floor(t * 2 + c.x * 0.02) % 2;
  const topY = y - 52 + sway;
  ctx.fillStyle = c.active ? 'rgba(255,255,255,0.7)' : 'rgba(190,190,200,0.5)';
  for (let i = 0; i < 34; i++) ctx.fillRect(x + (i % 6 < 3 ? sway : 0), topY + 18 + i, 1, 1);
  ctx.drawImage(c.active ? SPR_BALLOON : SPR_BALLOON_OFF, x - Math.floor(SPR_BALLOON.width / 2), topY);
}

/* The gold selector arrow on the game-over menu. */
const SPR_ARROW = bake(10, 11, (g) => {
  for (let r = 0; r < 11; r++) {
    const w = Math.round(10 - Math.abs(r - 5) * 2);
    if (w > 0) px(g, 0, r, w, 1, PAL.T);
  }
  px(g, 0, 4, 4, 3, '#fff0b0');
});

function drawFlowerIcon(ctx, x, y, filled) {
  ctx.drawImage(filled ? SPR_FLOWER : SPR_FLOWER_OFF, x, y);
}

function drawCoinIcon(ctx, x, y) {
  ctx.drawImage(SPR_COIN, x, y);
}

/* ------------------------------------------------------------------- spikes */

function drawSpikes(ctx, s) {
  const x0 = aw(s.tx);
  const y0 = aw(s.ty);
  const H = 28;
  const BASE = 17;
  for (let i = 0; i < 2; i++) {
    const cx = x0 + 10 + i * 20;
    for (let r = 0; r < H; r++) {
      const w = 1 + Math.floor((r * (BASE - 1)) / (H - 1));
      const x = cx - Math.floor(w / 2);
      const y = s.dir === 'up' ? y0 + ATILE - 1 - r : y0 + r;
      px(ctx, x - 1, y, w + 2, 1, PAL.o);          // outline
      px(ctx, x, y, w, 1, r < H * 0.35 ? PAL.l : PAL.g);
      px(ctx, x, y, 1, 1, PAL.l);
      if (w > 3) px(ctx, x + w - 1, y, 1, 1, PAL.n);
    }
  }
}

/* ------------------------------------------------------------------ terrain */

/* Tiles are baked once per level into a handful of variants, then blitted.
 * The look follows the reference art: a two-tone grass cap with a notched top
 * edge, grass dripping down into the dirt, speckled dirt, and a dark outline
 * around anything exposed. */
const TOP_VARIANTS = 8;
const FILL_VARIANTS = 6;

/* Dirt in the reference tileset is banded, not noisy: a lighter upper layer
 * under the grass, darker below, with a scatter of chunks for texture. */
function bakeDirt(g, level, v) {
  px(g, 0, 0, ATILE, ATILE, level.ground);
  px(g, 0, Math.round(ATILE * 0.55), ATILE, ATILE, level.groundDark);
  for (let i = 0; i < 9; i++) {
    const x = Math.floor(rnd(v * 13 + i, i, 3) * (ATILE - 8));
    const y = 4 + Math.floor(rnd(i, v, 5) * (ATILE - 10));
    const w = 3 + Math.floor(rnd(i, v, 7) * 4);
    const below = y > ATILE * 0.55;
    px(g, x, y, w * 2, 3, below ? level.ground : level.groundLight);
  }
  for (let i = 0; i < 6; i++) {
    px(g, Math.floor(rnd(i, v, 11) * (ATILE - 3)), Math.floor(rnd(v, i, 13) * ATILE), 3, 2, level.groundDark);
  }
}

/* The notched grass cap, shared by the solid and the floating tile. The two
 * outermost columns are fixed so neighbouring tiles always join cleanly. */
function grassCap(g, level, v) {
  for (let x = 0; x < ATILE; x += 2) {
    const edge = x < 2 || x >= ATILE - 2;
    const t = edge ? 3 : 3 + (rnd(x, v, 17) > 0.55 ? 2 : 0);
    px(g, x, t, 2, 9, level.grass);
    px(g, x, t + 9, 2, 5, level.grassDark);
    px(g, x, t - 2, 2, 2, level.outline);
  }
  for (let d = 0; d < 2; d++) {
    if (rnd(v, d, 19) > 0.62) continue;
    const dx = 4 + Math.floor(rnd(v, d, 23) * (ATILE - 12));
    const dh = 6 + Math.floor(rnd(v, d, 29) * 10);
    px(g, dx, 12, 5, dh, level.grassDark);
    px(g, dx, 12, 5, 2, level.grass);
  }
}

function bakeTopTile(level, v) {
  return bake(ATILE, ATILE, (g) => {
    bakeDirt(g, level, v);
    grassCap(g, level, v);
  }, false);
}

/* A ledge with nothing under it gets a ragged, tapering underside instead of a
 * ruled line — the floating platform in the reference hangs rather than sits. */
function bakeFloatTile(level, v) {
  return bake(ATILE, ATILE, (g) => {
    bakeDirt(g, level, v);
    grassCap(g, level, v);

    const STEP = 8;
    const cuts = [];
    for (let x = 0; x < ATILE; x += STEP) cuts.push(2 + Math.round(rnd(x, v, 71) * 5));
    g.globalCompositeOperation = 'destination-out';
    cuts.forEach((c, i) => g.fillRect(i * STEP, ATILE - c, STEP, c));
    g.globalCompositeOperation = 'source-over';

    g.fillStyle = level.outline;
    cuts.forEach((c, i) => {
      const y = ATILE - c;
      g.fillRect(i * STEP, y - 2, STEP, 2);
      const next = cuts[i + 1];
      if (next === undefined) return;
      const ny = ATILE - next;
      if (ny !== y) g.fillRect(i * STEP + STEP - 2, Math.min(y, ny) - 2, 2, Math.abs(ny - y) + 2);
    });
  }, false);
}

function bakeFillTile(level, v) {
  return bake(ATILE, ATILE, (g) => bakeDirt(g, level, v), false);
}

/* Scenery, built to match the reference tileset: two-tone foliage with lighter
 * patches up and to the left, a dark outline on everything, and chunky forms
 * that read at a glance. Foliage takes the level's own greens, so the same
 * shapes work on the day, rose and dusk levels. */

function bakeTree(level) {
  return bake(58, 66, (g) => {
    // trunk, flaring into roots at the base
    px(g, 25, 38, 9, 28, level.ground);
    px(g, 25, 38, 3, 28, level.groundLight);
    px(g, 22, 60, 15, 6, level.ground);
    px(g, 20, 63, 19, 3, level.ground);
    px(g, 33, 44, 2, 16, level.groundDark);

    for (const [x, y, r] of [[29, 26, 21], [14, 32, 14], [44, 32, 14], [29, 15, 16]]) {
      disc(g, x, y, r, level.grassDark);
    }
    for (const [x, y, r] of [[21, 17, 10], [38, 22, 8], [13, 29, 7], [30, 11, 7]]) {
      disc(g, x, y, r, level.grass);
    }
  });
}

function bakePine(level) {
  return bake(40, 58, (g) => {
    px(g, 16, 44, 8, 14, level.ground);
    px(g, 16, 44, 3, 14, level.groundLight);
    for (let i = 0; i < 3; i++) {
      const top = 3 + i * 14;
      const half = 8 + i * 5;
      for (let r = 0; r < 17; r++) {
        const hw = 2 + Math.round((r / 16) * half);
        px(g, 20 - hw, top + r, hw * 2, 1, r < 5 ? level.grass : level.grassDark);
      }
    }
  });
}

function bakeBushBig(level) {
  return bake(36, 22, (g) => {
    for (const [x, y, r] of [[10, 13, 9], [25, 14, 8], [17, 9, 9]]) disc(g, x, y, r, level.grassDark);
    for (const [x, y, r] of [[13, 8, 5], [26, 10, 4]]) disc(g, x, y, r, level.grass);
    px(g, 2, 18, 32, 4, level.grassDark);
  });
}

function bakeBushSmall(level) {
  return bake(24, 15, (g) => {
    for (const [x, y, r] of [[8, 9, 6], [16, 10, 5], [12, 6, 6]]) disc(g, x, y, r, level.grassDark);
    disc(g, 10, 5, 3, level.grass);
    px(g, 2, 12, 20, 3, level.grassDark);
  });
}

function bakeTuft(level) {
  return bake(17, 18, (g) => {
    const blades = [[0, 9], [4, 3], [8, 0], [12, 5]];
    for (const [x, top] of blades) {
      px(g, x, top, 2, 18 - top, level.grassDark);
      px(g, x, top, 2, Math.max(2, Math.round((18 - top) / 2)), level.grass);
    }
    px(g, 2, 16, 11, 2, level.grassDark);
  });
}

function petalFlower(g, cx, cy, petal, core) {
  for (const [dx, dy] of [[0, -3], [3, -1], [2, 3], [-2, 3], [-3, -1]]) disc(g, cx + dx, cy + dy, 2, petal);
  disc(g, cx, cy, 1, core);
}

function bakeDaisy(level) {
  return bake(11, 15, (g) => {
    px(g, 5, 6, 1, 9, level.grassDark);
    px(g, 2, 10, 3, 1, level.grassDark);
    px(g, 6, 12, 3, 1, level.grassDark);
    petalFlower(g, 5, 4, '#ffffff', '#ffcf3d');
  });
}

function bakeDaisyCluster(level) {
  return bake(24, 16, (g) => {
    px(g, 2, 11, 20, 5, level.grassDark);
    for (const [x, y] of [[5, 10], [12, 8], [19, 11]]) {
      px(g, x, y, 1, 6, level.grassDark);
      petalFlower(g, x, y - 2, '#ffffff', '#ffcf3d');
    }
  });
}

function bakeBlueFlower(level) {
  return bake(12, 16, (g) => {
    px(g, 6, 7, 1, 9, level.grassDark);
    px(g, 2, 11, 4, 1, level.grassDark);
    px(g, 7, 13, 4, 1, level.grassDark);
    petalFlower(g, 6, 5, '#3f86e0', '#ffcf3d');
    disc(g, 5, 4, 1, '#6aa8f2');
  });
}

function bakeMushroom() {
  return bake(17, 18, (g) => {
    px(g, 6, 10, 5, 8, '#e8d5b0');       // stem
    px(g, 6, 10, 2, 8, '#cbb894');
    for (let r = 0; r < 10; r++) {       // cap: narrow at the crown, wide at the brim
      const hw = Math.round(Math.sqrt(Math.max(0, 1 - Math.pow((9 - r) / 10, 2))) * 8);
      px(g, 8 - hw, 1 + r, hw * 2 + 1, 1, r > 7 ? '#2f66aa' : '#3b7fd4');
    }
    disc(g, 5, 5, 2, '#8fc2f5');
    disc(g, 11, 7, 1, '#8fc2f5');
  });
}

function bakeLog(level) {
  return bake(32, 15, (g) => {
    px(g, 5, 2, 26, 11, level.ground);
    px(g, 5, 2, 26, 3, level.groundLight);
    px(g, 5, 10, 26, 3, level.groundDark);
    for (let x = 10; x < 30; x += 6) px(g, x, 6, 4, 1, level.groundDark);
    for (let r = 0; r < 11; r++) {        // cut end, with rings
      const hw = Math.round(Math.sqrt(1 - ((r - 5) / 5.5) ** 2) * 5);
      px(g, 5 - hw, 2 + r, hw * 2 + 1, 1, level.groundLight);
    }
    disc(g, 5, 7, 3, level.ground);
    disc(g, 5, 7, 1, level.groundDark);
  });
}

function bakeSnail() {
  return bake(20, 14, (g) => {
    px(g, 2, 10, 14, 4, '#d8b37a');      // foot
    px(g, 13, 4, 4, 7, '#d8b37a');       // head
    px(g, 15, 0, 1, 5, '#c89a5b');       // antennae
    px(g, 18, 1, 1, 4, '#c89a5b');
    disc(g, 8, 7, 6, '#c08a4a');         // shell
    disc(g, 8, 7, 4, '#d8a866');
    disc(g, 8, 7, 2, '#a9743a');
    px(g, 8, 3, 1, 4, '#a9743a');
  });
}

function levelArt(level) {
  if (level._art) return level._art;
  const a = {
    top: Array.from({ length: TOP_VARIANTS }, (_, v) => bakeTopTile(level, v)),
    fill: Array.from({ length: FILL_VARIANTS }, (_, v) => bakeFillTile(level, v)),
    float: Array.from({ length: TOP_VARIANTS }, (_, v) => bakeFloatTile(level, v)),
    tree: bakeTree(level),
    pine: bakePine(level),
    bushBig: bakeBushBig(level),
    bushSmall: bakeBushSmall(level),
    tuft: bakeTuft(level),
    daisy: bakeDaisy(level),
    cluster: bakeDaisyCluster(level),
    blueFlower: bakeBlueFlower(level),
    mushroom: bakeMushroom(),
    log: bakeLog(level),
    snail: bakeSnail(),
  };
  level._art = a;
  return a;
}

function drawTerrain(ctx, level, cam, buf) {
  const art = levelArt(level);
  const rows = level.rows;
  const solid = (x, y) => x >= 0 && x < level.cols && y >= 0 && y < level.rowCount && rows[y][x] === '#';

  const x0 = Math.max(0, Math.floor(cam.x / TILE) - 1);
  const x1 = Math.min(level.cols - 1, Math.ceil((cam.x + buf.w / ART) / TILE));
  const y0 = Math.max(0, Math.floor(cam.y / TILE) - 1);
  const y1 = Math.min(level.rowCount - 1, Math.ceil((cam.y + buf.h / ART) / TILE));

  for (let ty = y0; ty <= y1; ty++) {
    for (let tx = x0; tx <= x1; tx++) {
      if (!solid(tx, ty)) continue;
      const x = tx * ATILE;
      const y = ty * ATILE;
      const open = !solid(tx, ty - 1);
      const hanging = open && !solid(tx, ty + 1);
      const v = Math.floor(rnd(tx, ty, 2) * TOP_VARIANTS) % TOP_VARIANTS;
      if (hanging) ctx.drawImage(art.float[v], x, y);
      else if (open) ctx.drawImage(art.top[v], x, y);
      else ctx.drawImage(art.fill[Math.floor(rnd(tx, ty, 4) * FILL_VARIANTS) % FILL_VARIANTS], x, y);

      if (!solid(tx - 1, ty)) px(ctx, x, y, 2, ATILE, level.outline);
      if (!solid(tx + 1, ty)) px(ctx, x + ATILE - 2, y, 2, ATILE, level.outline);
      if (!hanging && !solid(tx, ty + 1)) px(ctx, x, y + ATILE - 2, ATILE, 2, level.outline);

      // Scenery, only where the tile above is genuinely empty. Trees need a
      // couple of clear tiles overhead so a canopy never swallows a platform.
      if (open && ty > 0 && rows[ty - 1][tx] === '.') {
        const r = rnd(tx, ty, 31);
        const roomy = ty > 1 &&
          rows[ty - 1][tx - 1] === '.' && rows[ty - 1][tx + 1] === '.' &&
          rows[ty - 2][tx] === '.' && rows[ty - 2][tx - 1] === '.' && rows[ty - 2][tx + 1] === '.';
        const jitter = (span) => x + Math.floor(rnd(tx, ty, 37) * span);
        const sit = (spr, sx) => ctx.drawImage(spr, sx, y - spr.height + 5);
        if (r > 0.955 && roomy) sit(art.tree, x - 8);
        else if (r > 0.925 && roomy) sit(art.pine, x + 2);
        else if (r > 0.885) sit(art.bushBig, x + 3);
        else if (r > 0.845) sit(art.bushSmall, x + 8);
        else if (r > 0.815) sit(art.log, x + 5);
        else if (r > 0.790) sit(art.mushroom, jitter(20));
        else if (r > 0.768) sit(art.snail, jitter(18));
        else if (r > 0.720) sit(art.cluster, x + 8);
        else if (r > 0.648) sit(art.daisy, jitter(26));
        else if (r > 0.575) sit(art.blueFlower, jitter(24));
        else if (r > 0.440) sit(art.tuft, jitter(22));
      }
    }
  }
}

/* --------------------------------------------------------------- background */

function mixHex(a, b, t) {
  const pa = rgbOf(a);
  const pb = rgbOf(b);
  const c = pa.map((v, i) => Math.round(v + (pb[i] - v) * t));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}

/* The skies are painted images, one per level, scaled to the buffer width.
 * They are drawn twice — once normally, once mirrored — so the slow horizontal
 * parallax never runs off the end or shows a seam. */
const SKY_CACHE = {};
function skyImage(name) {
  if (!SKY_CACHE[name]) {
    const img = new Image();
    img.src = assetUrl(name);
    SKY_CACHE[name] = img;
  }
  return SKY_CACHE[name];
}
['sky-day', 'sky-rose', 'sky-dusk'].forEach(skyImage);

/* The dark falloff under the horizon, so gaps in the floor read as real drops
 * and not as more hillside. Dithered, and baked once. */
const SCRIM = (() => {
  const w = 640;
  const h = 200;
  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  const g = c.getContext('2d');
  const img = g.createImageData(w, h);
  const d = img.data;
  for (let y = 0; y < h; y++) {
    const dens = Math.min(1, Math.pow(y / h, 1.1) * 1.75);
    for (let x = 0; x < w; x++) {
      if (BAYER[y & 3][x & 3] >= dens * 16) continue;
      const o = (y * w + x) * 4;
      d[o] = 14; d[o + 1] = 8; d[o + 2] = 26; d[o + 3] = 178;
    }
  }
  g.putImageData(img, 0, 0);
  return c;
})();

function drawBackground(ctx, level, cam, buf, t) {
  const camX = cam.x * ART;
  const camY = cam.y * ART;

  const sky = skyImage(level.skyImage);
  if (sky.complete && sky.naturalWidth) {
    const sw = sky.naturalWidth;
    const ox = Math.round(camX * 0.16) % sw;
    const oy = Math.round(Math.min(Math.max(0, sky.naturalHeight - buf.h), camY * 0.12));
    ctx.drawImage(sky, 0, oy, sw, buf.h, -ox, 0, sw, buf.h);
    ctx.save();
    ctx.translate(-ox + sw * 2, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(sky, 0, oy, sw, buf.h, 0, 0, sw, buf.h);
    ctx.restore();
  } else {
    px(ctx, 0, 0, buf.w, buf.h, level.sky[0]);
  }

  const horizon = Math.round(buf.h - 96 - camY * 0.08);

  // Distance is faked by mixing each layer toward the sky colour rather than
  // by drawing it translucent: overlapping shapes at partial alpha pile up
  // into fog.
  const haze = (c, k) => mixHex(c, level.sky[1], k);

  const farShift = camX * 0.3;
  const farFirst = Math.floor((farShift - 40) / 19);
  for (let k = 0; k < buf.w / 19 + 6; k++) {
    const idx = farFirst + k;
    const sx = Math.round(idx * 19 - farShift);
    const r = 10 + Math.floor(rnd(idx, 0, 61) * 12);
    const dy = Math.floor(rnd(idx, 1, 67) * 10);
    disc(ctx, sx, horizon + 14 + dy, r, haze(level.hillBack, 0.45));
  }
  ctx.fillStyle = haze(level.hillBack, 0.45);
  ctx.fillRect(0, horizon + 22, buf.w, buf.h - horizon - 22);

  // Near foliage: a solid band with bushy bumps along its top edge, the way
  // the reference background closes off the horizon.
  const base = horizon + 20;
  const near = haze(level.hill, 0.24);
  const nearLit = haze(level.grass, 0.3);
  ctx.fillStyle = near;
  ctx.fillRect(0, base + 8, buf.w, buf.h - base - 8);
  const shift = camX * 0.5;
  const first = Math.floor((shift - 40) / 15);
  for (let k = 0; k < buf.w / 15 + 6; k++) {
    const idx = first + k;
    const sx = Math.round(idx * 15 - shift);
    const r = 8 + Math.floor(rnd(idx, 0, 51) * 13);
    const dy = Math.floor(rnd(idx, 1, 53) * 9);
    disc(ctx, sx, base + dy, r, near);
    if (rnd(idx, 2, 57) > 0.45) disc(ctx, sx - 2, base + dy - 2, Math.max(2, r - 5), nearLit);
  }

  // Depth falloff, dithered rather than smoothly blended, so gaps in the floor
  // read as real drops and not as more hillside. Baked once — doing this per
  // pixel per frame is far too slow.
  const scrimTop = horizon + 14;
  ctx.drawImage(SCRIM, 0, scrimTop);
  const solidFrom = scrimTop + SCRIM.height;
  if (solidFrom < buf.h) px(ctx, 0, solidFrom, buf.w, buf.h - solidFrom, 'rgba(14,8,26,0.7)');

  if (level.title) return;

  // Clamped so the bunting never drifts up over the flowers and level name.
  const buntY = Math.max(36, Math.round(58 - camY * 0.16));
  const flags = ['#ff6b9d', '#ffd84d', '#6ad1c8', '#b48cff'];
  ctx.fillStyle = 'rgba(255,255,255,0.75)';
  for (let x = 0; x < buf.w; x += 2) {
    const y = buntY + Math.round(Math.abs(Math.sin((x + camX * 0.45) * 0.009)) * 10);
    ctx.fillRect(x, y, 2, 2);
  }
  for (let i = 0; i < 18; i++) {
    const fx = Math.round(i * 48 - ((camX * 0.45) % 48));
    if (fx < -16 || fx > buf.w + 16) continue;
    const fy = buntY + Math.round(Math.abs(Math.sin((fx + camX * 0.45) * 0.009)) * 10);
    ctx.fillStyle = PAL.o;
    for (let r = 0; r < 11; r++) ctx.fillRect(fx - 6 + Math.floor(r / 2), fy + 2 + r, 12 - r, 1);
    ctx.fillStyle = flags[i % flags.length];
    for (let r = 0; r < 9; r++) ctx.fillRect(fx - 4 + Math.floor(r / 2), fy + 3 + r, 9 - r, 1);
  }
}

/* A chunky bordered box for HUD panels and overlay cards. */
function pixelPanel(ctx, x, y, w, h, fill = 'rgba(24,16,38,0.88)', border = '#f7e9f2') {
  px(ctx, x + 2, y, w - 4, h, fill);
  px(ctx, x, y + 2, w, h - 4, fill);
  px(ctx, x + 2, y, w - 4, 2, border);
  px(ctx, x + 2, y + h - 2, w - 4, 2, border);
  px(ctx, x, y + 2, 2, h - 4, border);
  px(ctx, x + w - 2, y + 2, 2, h - 4, border);
}
</script>
<script>
/* Keyboard + on-screen touch controls, collapsed into one small state object. */
const Input = (() => {
  const held = new Set();
  const pressed = new Set(); // consumed once per frame by the game loop
  const touch = { left: false, right: false, jump: false };
  let jumpQueued = false;

  const LEFT = ['ArrowLeft', 'KeyA'];
  const RIGHT = ['ArrowRight', 'KeyD'];
  const JUMP = ['Space', 'ArrowUp', 'KeyW', 'KeyZ'];

  window.addEventListener('keydown', (e) => {
    if ([...LEFT, ...RIGHT, ...JUMP, 'ArrowDown', 'KeyS', 'KeyR', 'KeyP', 'Enter', 'Escape'].includes(e.code)) e.preventDefault();
    if (e.repeat) return;
    held.add(e.code);
    pressed.add(e.code);
    if (JUMP.includes(e.code)) jumpQueued = true;
  });
  window.addEventListener('keyup', (e) => held.delete(e.code));
  window.addEventListener('blur', () => { held.clear(); touch.left = touch.right = touch.jump = false; });

  function bindTouch(el, key) {
    if (!el) return;
    const on = (e) => { e.preventDefault(); touch[key] = true; if (key === 'jump') jumpQueued = true; };
    const off = (e) => { e.preventDefault(); touch[key] = false; };
    el.addEventListener('touchstart', on, { passive: false });
    el.addEventListener('touchend', off, { passive: false });
    el.addEventListener('touchcancel', off, { passive: false });
    el.addEventListener('mousedown', on);
    el.addEventListener('mouseup', off);
    el.addEventListener('mouseleave', off);
  }

  return {
    bindTouch,
    get left() { return LEFT.some((k) => held.has(k)) || touch.left; },
    get right() { return RIGHT.some((k) => held.has(k)) || touch.right; },
    get jumpHeld() { return JUMP.some((k) => held.has(k)) || touch.jump; },
    /** True once for each fresh jump press; cleared when the game reads it. */
    takeJump() { const q = jumpQueued; jumpQueued = false; return q; },
    wasPressed(code) { return pressed.has(code); },
    endFrame() { pressed.clear(); },
    clear() { held.clear(); pressed.clear(); jumpQueued = false; touch.left = touch.right = touch.jump = false; },
  };
})();
</script>
<script>
/* Tiny WebAudio blips. Created lazily so nothing is built before the first
 * user gesture, which is what browsers require to start audio. */
const Sound = (() => {
  let ctx = null;
  let muted = false;

  function ac() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  function tone(freq, dur, type = 'square', gain = 0.06, delay = 0) {
    if (muted) return;
    const a = ac();
    if (!a) return;
    const t0 = a.currentTime + delay;
    const osc = a.createOscillator();
    const g = a.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g).connect(a.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  }

  function slide(f0, f1, dur, type = 'sawtooth', gain = 0.05) {
    if (muted) return;
    const a = ac();
    if (!a) return;
    const t0 = a.currentTime;
    const osc = a.createOscillator();
    const g = a.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(f0, t0);
    osc.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t0 + dur);
    g.gain.setValueAtTime(gain, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g).connect(a.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  }

  const N = { C4: 261.63, D4: 293.66, E4: 329.63, F4: 349.23, G4: 392.0, A4: 440.0, Bb4: 466.16, C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99 };

  return {
    unlock() { ac(); },
    toggleMute() { muted = !muted; return muted; },
    get muted() { return muted; },
    jump() { slide(420, 720, 0.13, 'square', 0.045); },
    land() { slide(180, 90, 0.08, 'sine', 0.05); },
    hurt() { slide(330, 90, 0.32, 'sawtooth', 0.07); },
    coin() { tone(N.E5, 0.09, 'triangle', 0.06); tone(N.G5, 0.12, 'triangle', 0.06, 0.08); },
    checkpoint() { tone(N.C5, 0.1, 'triangle', 0.06); tone(N.E5, 0.1, 'triangle', 0.06, 0.09); tone(N.G5, 0.18, 'triangle', 0.06, 0.18); },
    fail() { tone(N.G4, 0.16, 'square', 0.06); tone(N.E4, 0.16, 'square', 0.06, 0.15); tone(N.C4, 0.4, 'square', 0.06, 0.3); },
    levelClear() { [N.C5, N.E5, N.G5, N.C5 * 2].forEach((f, i) => tone(f, 0.2, 'triangle', 0.06, i * 0.11)); },
    /* "Happy Birthday", first phrase and a half — the win jingle. */
    birthday() {
      const q = 0.26;
      const song = [
        [N.G4, 0.5], [N.G4, 0.5], [N.A4, 1], [N.G4, 1], [N.C5, 1], [N.Bb4, 2],
        [N.G4, 0.5], [N.G4, 0.5], [N.A4, 1], [N.G4, 1], [N.D5, 1], [N.C5, 2],
      ];
      let t = 0;
      for (const [f, beats] of song) {
        tone(f, beats * q * 0.88, 'triangle', 0.07, t);
        t += beats * q;
      }
    },
  };
})();
</script>
<script>
/* Nandini's Birthday Run — main loop, physics and game states. */

// The game is drawn as pixel art into a small buffer, then blown up by whole
// pixels onto the visible canvas. BUF is the art resolution; ART (in
// sprites.js) converts world pixels to art pixels.
const BUF = { w: 640, h: 360 };
// Text is laid out in a fixed 960x540 space and scaled to whatever integer
// zoom the window allows, so the copy never has to move.
const VIEW = { w: 960, h: 540 };
const A2T = VIEW.w / BUF.w;      // art pixels -> text-space pixels
const WORLD_VIEW = { w: BUF.w / ART, h: BUF.h / ART };
let SCALE = 0;   // art pixels -> css pixels, always a whole number (0 = not laid out yet)
let DPR = 1;
let STORE = 1;   // whole-number scale of the backing store
let TURNED = null;

// Movement constants. The level maps in levels.js are designed against these:
// a full jump clears 131px (3 tiles) of height and about 190px of distance.
const GRAVITY = 2200;
const JUMP_V = 760;
const RUN_SPEED = 280;
const GROUND_ACCEL = 2400;
const AIR_ACCEL = 1500;
const GROUND_FRICTION = 2600;
const MAX_FALL = 1600;
const COYOTE_TIME = 0.11;      // still jumpable just after walking off a ledge
const JUMP_BUFFER = 0.14;      // a jump pressed just before landing still counts
const JUMP_CUT = 0.45;         // releasing jump early shortens the hop
const HARD_LAND_V = 1350;      // landing faster than this hurts (~10 tiles of fall)
const MAX_HP = 5;
const INVULN_TIME = 1.3;

const PLAYER_W = 28;
const PLAYER_H = 40;

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// The pixel-art buffer. Everything is drawn here first, at 320x180.
const buffer = document.createElement('canvas');
buffer.width = BUF.w;
buffer.height = BUF.h;
const bctx = buffer.getContext('2d');

const FONT = '"Press Start 2P", "Courier New", monospace';

const state = {
  mode: 'title',          // title | intro | play | hurtReset | dead | clear | win
  levelIndex: 0,
  level: null,
  player: null,
  cam: { x: 0, y: 0 },
  shake: 0,
  time: 0,
  modeTime: 0,
  particles: [],
  coinsThisLevel: 0,
  coinsTotal: 0,
  unlocked: 1,
  menuIndex: 0,
};

/* ---------------------------------------------------------------- progress */

const SAVE_KEY = 'nandini-birthday-run';
function loadProgress() {
  try {
    const raw = JSON.parse(localStorage.getItem(SAVE_KEY) || '{}');
    state.unlocked = Math.min(LEVELS.length, Math.max(1, raw.unlocked || 1));
  } catch (e) { state.unlocked = 1; }
}
function saveProgress() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({ unlocked: state.unlocked }));
  } catch (e) { /* private browsing — progress just won't persist */ }
}

/* ------------------------------------------------------------------ helpers */

const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
const overlaps = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
const playerRect = (p) => ({ x: p.x - PLAYER_W / 2, y: p.y - PLAYER_H, w: PLAYER_W, h: PLAYER_H });

function spawnParticles(x, y, count, opts) {
  for (let i = 0; i < count; i++) {
    const a = opts.angle !== undefined ? opts.angle + (Math.random() - 0.5) * (opts.spread || 1) : Math.random() * Math.PI * 2;
    const sp = (opts.speed || 120) * (0.4 + Math.random() * 0.8);
    state.particles.push({
      x, y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp,
      life: opts.life || 0.6,
      maxLife: opts.life || 0.6,
      size: opts.size || 3,
      color: Array.isArray(opts.color) ? opts.color[(Math.random() * opts.color.length) | 0] : opts.color,
      gravity: opts.gravity === undefined ? 900 : opts.gravity,
      spin: (Math.random() - 0.5) * 10,
      rot: Math.random() * 6.28,
      shape: opts.shape || 'dot',
    });
  }
}

/* --------------------------------------------------------------- level flow */

function startLevel(index) {
  state.levelIndex = index;
  state.level = buildLevel(LEVELS[index]);
  state.coinsThisLevel = 0;
  state.particles.length = 0;
  const L = state.level;
  state.player = {
    x: L.spawn.x,
    y: L.spawn.y,
    vx: 0,
    vy: 0,
    facing: 1,
    grounded: false,
    coyote: 0,
    buffer: 0,
    hp: MAX_HP,
    invuln: 0,
    runPhase: 0,
    idleTime: 0,
    respawn: { x: L.spawn.x, y: L.spawn.y },
    fadeIn: 0,
  };
  centerCamera(true);
  setMode('intro');
}

function setMode(mode) {
  state.mode = mode;
  state.modeTime = 0;
  if (mode === 'dead') state.menuIndex = 0;   // always start on YES
}

function centerCamera(snap) {
  const p = state.player;
  const L = state.level;
  const tx = clamp(p.x - WORLD_VIEW.w / 2, 0, Math.max(0, L.width - WORLD_VIEW.w));
  const ty = clamp(p.y - WORLD_VIEW.h * 0.62, 0, Math.max(0, L.height - WORLD_VIEW.h));
  if (snap) { state.cam.x = tx; state.cam.y = ty; }
  return { tx, ty };
}

/* ------------------------------------------------------------------ damage */

function hurt(amount, fromX) {
  const p = state.player;
  if (p.invuln > 0 || state.mode !== 'play') return;
  p.hp -= amount;
  p.invuln = INVULN_TIME;
  state.shake = 8;
  Sound.hurt();
  spawnParticles(p.x, p.y - PLAYER_H / 2, 12, {
    color: ['#ffffff', '#ffd6e5', '#ff9ec2'], speed: 200, life: 0.7, size: 3.5, shape: 'petal',
  });
  if (fromX !== undefined) {
    const dir = p.x < fromX ? -1 : 1;
    p.vx = dir * 260;
    p.vy = -300;
    p.grounded = false;
  }
  if (p.hp <= 0) {
    p.hp = 0;
    Sound.fail();
    setMode('dead');
  }
}

/* A fall out of the world: costs a flower and sends her back to the last
 * checkpoint, rather than knocking her around in mid-air. */
function fallOut() {
  const p = state.player;
  p.hp -= 1;
  Sound.hurt();
  state.shake = 7;
  if (p.hp <= 0) {
    p.hp = 0;
    Sound.fail();
    setMode('dead');
    return;
  }
  p.x = p.respawn.x;
  p.y = p.respawn.y;
  p.vx = 0;
  p.vy = 0;
  p.invuln = INVULN_TIME;
  p.fadeIn = 0.45;
  centerCamera(true);
}

/* ------------------------------------------------------------------ physics */

function moveAxis(p, dx, dy, solids) {
  if (dx !== 0) {
    p.x += dx;
    const r = playerRect(p);
    for (const s of solids) {
      if (!overlaps(r, s)) continue;
      if (dx > 0) p.x = s.x - PLAYER_W / 2;
      else p.x = s.x + s.w + PLAYER_W / 2;
      p.vx = 0;
      r.x = p.x - PLAYER_W / 2;
    }
  }
  if (dy !== 0) {
    p.y += dy;
    const r = playerRect(p);
    for (const s of solids) {
      if (!overlaps(r, s)) continue;
      if (dy > 0) {
        p.y = s.y;
        if (!p.grounded && p.vy > HARD_LAND_V) {
          hurt(1);
          spawnParticles(p.x, p.y, 16, { color: ['#c9b18f', '#e8d7bd'], speed: 220, angle: -Math.PI / 2, spread: 2.4, life: 0.5, size: 3 });
        } else if (p.vy > 400) {
          Sound.land();
          spawnParticles(p.x, p.y, 6, { color: ['#ffffff', '#e8e8e8'], speed: 110, angle: -Math.PI / 2, spread: 2.2, life: 0.32, size: 2.5 });
        }
        p.grounded = true;
        p.coyote = COYOTE_TIME;
      } else {
        p.y = s.y + s.h + PLAYER_H;
      }
      p.vy = 0;
      r.y = p.y - PLAYER_H;
    }
  }
}

function updatePlay(dt) {
  const p = state.player;
  const L = state.level;

  const wantLeft = Input.left;
  const wantRight = Input.right;
  const dir = (wantRight ? 1 : 0) - (wantLeft ? 1 : 0);

  const accel = p.grounded ? GROUND_ACCEL : AIR_ACCEL;
  if (dir !== 0) {
    p.vx += dir * accel * dt;
    p.vx = clamp(p.vx, -RUN_SPEED, RUN_SPEED);
    p.facing = dir;
  } else if (p.grounded) {
    const drop = GROUND_FRICTION * dt;
    p.vx = Math.abs(p.vx) <= drop ? 0 : p.vx - Math.sign(p.vx) * drop;
  }

  // jump: coyote time + input buffering make the controls forgiving
  if (Input.takeJump()) p.buffer = JUMP_BUFFER;
  p.buffer = Math.max(0, p.buffer - dt);
  p.coyote = p.grounded ? COYOTE_TIME : Math.max(0, p.coyote - dt);
  if (p.buffer > 0 && p.coyote > 0) {
    p.vy = -JUMP_V;
    p.grounded = false;
    p.buffer = 0;
    p.coyote = 0;
    Sound.jump();
    spawnParticles(p.x, p.y, 5, { color: ['#ffffff'], speed: 90, angle: Math.PI / 2, spread: 1.8, life: 0.28, size: 2.5 });
  }
  if (!Input.jumpHeld && p.vy < 0) p.vy *= Math.pow(JUMP_CUT, dt * 60);

  p.vy = Math.min(MAX_FALL, p.vy + GRAVITY * dt);

  const wasGrounded = p.grounded;
  p.grounded = false;
  moveAxis(p, p.vx * dt, 0, L.solids);
  moveAxis(p, 0, p.vy * dt, L.solids);
  if (wasGrounded && !p.grounded && p.vy >= 0) p.coyote = Math.max(p.coyote, COYOTE_TIME);

  p.x = clamp(p.x, PLAYER_W / 2, L.width - PLAYER_W / 2);
  if (p.grounded && Math.abs(p.vx) > 20) p.runPhase += dt * (6 + Math.abs(p.vx) / 34);
  p.idleTime = p.grounded && dir === 0 && Math.abs(p.vx) < 20 ? p.idleTime + dt : 0;
  p.invuln = Math.max(0, p.invuln - dt);
  p.fadeIn = Math.max(0, p.fadeIn - dt);

  // fell out of the world
  if (p.y > L.deathY) { fallOut(); return; }

  const r = playerRect(p);

  for (const s of L.spikes) {
    if (overlaps(r, s)) { hurt(1, s.x + s.w / 2); break; }
  }

  for (const c of L.coins) {
    if (c.taken) continue;
    if (overlaps(r, { x: c.x - 14, y: c.y - 14, w: 28, h: 28 })) {
      c.taken = true;
      state.coinsThisLevel++;
      state.coinsTotal++;
      Sound.coin();
      spawnParticles(c.x, c.y, 10, { color: ['#ffd84d', '#ffef9e', '#ffffff'], speed: 170, life: 0.55, size: 3, gravity: 300 });
    }
  }

  for (const c of L.checkpoints) {
    if (c.active) continue;
    if (overlaps(r, { x: c.x - 20, y: c.y - 70, w: 40, h: 70 })) {
      c.active = true;
      p.respawn = { x: c.x, y: c.y };
      Sound.checkpoint();
      spawnParticles(c.x, c.y - 55, 14, { color: ['#ffffff', '#ff5f8d', '#ffd84d'], speed: 170, life: 0.8, size: 3, gravity: 220 });
    }
  }

  if (L.cake && overlaps(r, { x: L.cake.x - 26, y: L.cake.y - 70, w: 52, h: 70 })) {
    const last = state.levelIndex === LEVELS.length - 1;
    if (last) {
      Sound.birthday();
      setMode('win');
    } else {
      Sound.levelClear();
      state.unlocked = Math.max(state.unlocked, state.levelIndex + 2);
      saveProgress();
      setMode('clear');
    }
    for (let i = 0; i < 60; i++) {
      spawnParticles(L.cake.x + (Math.random() - 0.5) * 120, L.cake.y - 80 - Math.random() * 60, 1, {
        color: ['#ff6b9d', '#ffd84d', '#6ad1c8', '#b48cff', '#ffffff'],
        speed: 180, life: 2.2, size: 5, gravity: 260, shape: 'confetti',
      });
    }
  }
}

function updateParticles(dt) {
  for (let i = state.particles.length - 1; i >= 0; i--) {
    const q = state.particles[i];
    q.life -= dt;
    if (q.life <= 0) { state.particles.splice(i, 1); continue; }
    q.vy += q.gravity * dt;
    q.x += q.vx * dt;
    q.y += q.vy * dt;
    q.rot += q.spin * dt;
  }
}

/* ------------------------------------------------------------------ drawing */

function drawParticles() {
  for (const q of state.particles) {
    const a = clamp(q.life / q.maxLife, 0, 1);
    if (a < 0.15 && Math.floor(state.time * 20) % 2) continue;   // blink out
    const x = Math.round(q.x * ART);
    const y = Math.round(q.y * ART);
    bctx.fillStyle = q.color;
    if (q.shape === 'confetti') bctx.fillRect(x, y, 4, 2);
    else bctx.fillRect(x, y, a > 0.5 ? 3 : 2, a > 0.5 ? 3 : 2);
  }
}

/* Text goes onto the full-size canvas rather than the pixel buffer, so it
 * stays readable; everything else is pixels. */
function txt(str, x, y, size, color, align = 'center', shadow = false) {
  ctx.font = `${size}px ${FONT}`;
  ctx.textAlign = align;
  ctx.textBaseline = 'middle';
  if (shadow) {
    ctx.fillStyle = 'rgba(20,12,30,0.85)';
    ctx.fillText(str, x + size * 0.16, y + size * 0.16);
  }
  ctx.fillStyle = color;
  ctx.fillText(str, x, y);
}

/* The chunky arcade heading from the reference: a dark outline all round, a
 * warm body, a shadow beneath, and a lighter upper half produced by clipping
 * and redrawing the same glyphs. */
function blockTitle(text, cx, y, size) {
  ctx.font = `${size}px ${FONT}`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const o = Math.max(2, Math.round(size * 0.1));
  ctx.fillStyle = '#4d2208';
  for (let dx = -o; dx <= o; dx += o) {
    for (let dy = -o; dy <= o; dy += o) if (dx || dy) ctx.fillText(text, cx + dx, y + dy);
  }
  ctx.fillStyle = '#8a3d10';
  ctx.fillText(text, cx, y + o);
  ctx.fillStyle = '#e07a1e';
  ctx.fillText(text, cx, y);
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, y - size, VIEW.w, size * 0.95);
  ctx.clip();
  ctx.fillStyle = '#ffc247';
  ctx.fillText(text, cx, y);
  ctx.restore();
}

function textWidthArt(str, size) {
  ctx.font = `${size}px ${FONT}`;
  return Math.ceil(ctx.measureText(str).width / A2T);
}

/* The reference HUD has no panels: the flowers sit straight on the sky, so the
 * text carries its own drop shadow to stay readable over anything. */
function drawHUDIcons() {
  const p = state.player;
  for (let i = 0; i < MAX_HP; i++) drawFlowerIcon(bctx, 8 + i * 19, 8, i < p.hp);
  drawCoinIcon(bctx, 9, 33);
}

function drawHUDText() {
  txt(`${state.coinsThisLevel}/${state.level.coins.length}`, 30 * A2T, 42 * A2T, 10, '#fff', 'left', true);
  txt(`L${state.levelIndex + 1}  ${state.level.name.toUpperCase()}`,
      (BUF.w - 10) * A2T, 16 * A2T, 10, '#ffd84d', 'right', true);
}

/* ------------------------------------------------------------- title screen */

function titleScene() {
  // Sunset sky over green ground, as in the design reference.
  if (!state.titleLevel) state.titleLevel = buildLevel({ ...LEVELS[0], skyImage: 'sky-dusk', sky: LEVELS[2].sky, title: true });
  drawBackground(bctx, state.titleLevel, { x: 400, y: 240 }, BUF, state.time);

  // a strip of ground for her to stand on
  const art = levelArt(state.titleLevel);
  for (let tx = 0; tx < BUF.w / ATILE + 1; tx++) {
    bctx.drawImage(art.top[tx % art.top.length], tx * ATILE, 196);
  }
  bctx.drawImage(art.tree, 22, 196 - art.tree.height + 6);
  bctx.drawImage(art.bushBig, 116, 196 - art.bushBig.height + 5);
  bctx.drawImage(art.cluster, 168, 196 - art.cluster.height + 5);
  bctx.drawImage(art.mushroom, 470, 196 - art.mushroom.height + 5);
  bctx.drawImage(art.tuft, 540, 196 - art.tuft.height + 5);

  drawNandini(bctx, 214, 200, 1, {
    runPhase: 0, grounded: true, rising: false, hurtFlash: false,
    speed: 0, idleTime: state.time, time: state.time, victory: false,
  });
  drawCake(bctx, 430, 200, state.time);
  for (let i = 0; i < MAX_HP; i++) drawFlowerIcon(bctx, 8 + i * 19, 8, true);

  pixelPanel(bctx, 26, 240, BUF.w - 52, 112, 'rgba(22,16,42,0.92)', '#8f7ad4');

  // legend row: what each thing in the game is
  const y = 296;
  drawNandini(bctx, 92, y + 24, 1, {
    runPhase: 0, grounded: true, rising: false, hurtFlash: false,
    speed: 0, idleTime: 0, time: state.time, victory: false,
  });
  drawNandini(bctx, 196, y + 24, 1, {
    runPhase: 0, grounded: false, rising: true, hurtFlash: false,
    speed: 200, time: state.time, victory: false,
  });
  const coin = COIN_FRAMES[Math.floor(state.time * 7) % COIN_FRAMES.length];
  bctx.drawImage(coin, 300 - coin.width / 2, y + 4);
  drawSpikes(bctx, { tx: 364, ty: y - 16, dir: 'up' });
  drawSpikes(bctx, { tx: 404, ty: y - 16, dir: 'up' });
  bctx.drawImage(SPR_CAKE, 0, 0, SPR_CAKE.width, SPR_CAKE.height,
                 500 - 17, y - 10, Math.round(SPR_CAKE.width * 0.7), Math.round(SPR_CAKE.height * 0.7));
}

function titleText() {
  txt("NANDINI'S", VIEW.w / 2, 74, 26, '#fff', 'center', true);
  txt('BIRTHDAY RUN', VIEW.w / 2, 110, 26, '#ffd84d', 'center', true);
  txt('5 FLOWERS   3 LEVELS   1 CAKE', VIEW.w / 2, 142, 9, '#ffd8ea', 'center', true);
  if (Math.floor(state.time * 2) % 2) txt('PRESS ENTER TO START', VIEW.w / 2, 336, 12, '#ffd84d', 'center', true);
  if (state.unlocked > 1) txt(`1-${state.unlocked} PICKS A LEVEL`, VIEW.w / 2, 356, 8, '#ffe9b0', 'center', true);

  txt('REACH THE BIRTHDAY CAKE!', VIEW.w / 2, 396, 17, '#fff');
  const labels = ['MOVE', 'JUMP', 'COLLECT', 'AVOID SPIKES', 'REACH GOAL'];
  const xs = [138, 294, 450, 606, 750];
  labels.forEach((l, i) => txt(l, xs[i], 508, 9, '#d9cbf5'));
}

/* ----------------------------------------------------------------- overlays */

function overlayPanels() {
  const m = state.mode;
  if (m === 'intro' && state.modeTime < 2.1) pixelPanel(bctx, 80, 112, BUF.w - 160, 92);
  else if (m === 'dead') {
    px(bctx, 0, 0, BUF.w, BUF.h, 'rgba(20,10,24,0.66)');
    // A soft band behind the wording, fading out at both ends, so the menu
    // stays readable over whatever the level happens to have here without
    // putting a panel box around it.
    const veil = bctx.createLinearGradient(0, 52, 0, 252);
    veil.addColorStop(0, 'rgba(16,9,26,0)');
    veil.addColorStop(0.22, 'rgba(16,9,26,0.58)');
    veil.addColorStop(0.78, 'rgba(16,9,26,0.58)');
    veil.addColorStop(1, 'rgba(16,9,26,0)');
    bctx.fillStyle = veil;
    bctx.fillRect(0, 52, BUF.w, 200);
    // her spent flowers, centred: the reason the run ended, stated plainly
    for (let i = 0; i < MAX_HP; i++) drawFlowerIcon(bctx, 262 + i * 26, 76, false);
    bctx.drawImage(SPR_ARROW, 290, 189 + state.menuIndex * 24);
  } else if (m === 'clear') {
    px(bctx, 0, 0, BUF.w, BUF.h, 'rgba(20,10,24,0.5)');
    pixelPanel(bctx, 68, 104, BUF.w - 136, 124);
  } else if (m === 'win' && state.modeTime > 0.6) {
    px(bctx, 0, 0, BUF.w, BUF.h, 'rgba(20,10,24,0.6)');
    pixelPanel(bctx, 48, 76, BUF.w - 96, 192);
  }
}

function overlayText() {
  const L = state.level;
  const m = state.mode;
  const blink = Math.floor(state.time * 2) % 2;
  if (m === 'intro' && state.modeTime < 2.1) {
    txt(`LEVEL ${state.levelIndex + 1}`, VIEW.w / 2, 200, 10, '#ffd84d');
    txt(L.name.toUpperCase(), VIEW.w / 2, 232, 16, '#fff');
    txt(L.hint.toUpperCase(), VIEW.w / 2, 268, 8, '#c9b6d8');
  } else if (m === 'dead') {
    txt('COINS', VIEW.w - 40, 42, 10, '#fff', 'right', true);
    txt(`${state.coinsThisLevel}`, VIEW.w - 40, 68, 16, '#ffd84d', 'right', true);
    blockTitle('GAME OVER', VIEW.w / 2, 176, 44);
    txt('TRY AGAIN ?', VIEW.w / 2, 240, 13, '#fff', 'center', true);
    txt('YES', 468, 292, 15, state.menuIndex === 0 ? '#fff' : '#8d84a0', 'left', true);
    txt('NO', 468, 328, 15, state.menuIndex === 1 ? '#fff' : '#8d84a0', 'left', true);
  } else if (m === 'clear') {
    txt('LEVEL COMPLETE', VIEW.w / 2, 190, 19, '#ffd84d');
    txt(`COINS ${state.coinsThisLevel}/${L.coins.length}`, VIEW.w / 2, 228, 11, '#fff');
    txt(`FLOWERS ${state.player.hp}/${MAX_HP}`, VIEW.w / 2, 254, 11, '#fff');
    if (blink) txt('PRESS ENTER', VIEW.w / 2, 296, 11, '#ffd84d');
  } else if (m === 'win' && state.modeTime > 0.6) {
    txt('HAPPY BIRTHDAY', VIEW.w / 2, 158, 24, '#fff');
    txt('NANDINI!', VIEW.w / 2, 204, 34, '#ffd84d');
    txt('SHE MADE IT TO THE CAKE', VIEW.w / 2, 250, 10, '#ffb8d2');
    txt(`COINS ${state.coinsTotal}   FLOWERS ${state.player.hp}/${MAX_HP}`, VIEW.w / 2, 286, 10, '#fff');
    if (blink) txt('PRESS ENTER TO PLAY AGAIN', VIEW.w / 2, 330, 10, '#ffd84d');
  }
}

/* ------------------------------------------------------------------- render */

/* Size the canvas to a whole-number multiple of the art resolution. Anything
 * else would resample the pixels unevenly and make some of them fatter than
 * others. */
/* True when the stylesheet has turned the stage sideways, which swaps the space
 * the game has to fit into. Must match the matching rule in css/style.css. */
const PORTRAIT_PHONE = window.matchMedia(
  '(hover: none) and (pointer: coarse) and (orientation: portrait) and (max-width: 700px)');

function layout() {
  const dpr = Math.max(1, Math.floor(window.devicePixelRatio || 1));
  const foot = document.getElementById('footnote');
  const footH = foot && getComputedStyle(foot).display !== 'none' ? foot.offsetHeight + 12 : 4;
  const turned = PORTRAIT_PHONE.matches;
  const vw = document.documentElement.clientWidth;
  const vh = document.documentElement.clientHeight;
  const availW = (turned ? vh : vw) - 8;
  const availH = (turned ? vw : vh) - footH - 8;
  // Whole-number zoom keeps every art pixel the same size. Only when the
  // window is smaller than the art itself do we fall back to a fractional
  // scale, because the alternative is not fitting on screen at all.
  const fit = Math.min(availW / BUF.w, availH / BUF.h);
  const s = fit >= 1 ? Math.floor(fit) : Math.max(0.35, fit);
  if (s === SCALE && dpr === DPR && turned === TURNED) return;
  TURNED = turned;
  SCALE = s;
  DPR = dpr;
  const store = Math.max(1, Math.round(s));   // backing store stays whole
  canvas.style.width = Math.round(BUF.w * s) + 'px';
  canvas.style.height = Math.round(BUF.h * s) + 'px';
  canvas.width = BUF.w * store * dpr;
  canvas.height = BUF.h * store * dpr;
  STORE = store;
}

/* Switch the canvas into the 960x540 space the text is written against. */
function textSpace() {
  const k = (DPR * STORE * BUF.w) / VIEW.w;
  ctx.setTransform(k, 0, 0, k, 0, 0);
}

function blitBuffer() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(buffer, 0, 0, BUF.w, BUF.h, 0, 0, BUF.w * STORE, BUF.h * STORE);
}

function render() {
  layout();

  if (state.mode === 'title') {
    titleScene();
    blitBuffer();
    textSpace();
    titleText();
    return;
  }

  const L = state.level;
  const p = state.player;

  drawBackground(bctx, L, state.cam, BUF, state.time);

  const shake = state.shake > 0 ? Math.round((Math.random() - 0.5) * state.shake) : 0;
  const shakeY = state.shake > 0 ? Math.round((Math.random() - 0.5) * state.shake) : 0;

  bctx.save();
  bctx.translate(-Math.round(state.cam.x * ART) + shake, -Math.round(state.cam.y * ART) + shakeY);

  drawTerrain(bctx, L, state.cam, BUF);
  for (const s of L.spikes) drawSpikes(bctx, s);
  for (const c of L.checkpoints) drawCheckpoint(bctx, c, state.time);
  for (const c of L.coins) if (!c.taken) drawCoin(bctx, c, state.time);
  if (L.cake) drawCake(bctx, L.cake.x, L.cake.y, state.time);
  drawParticles();

  const blinking = p.invuln > 0 && Math.floor(state.time * 18) % 2 === 0;
  const fading = p.fadeIn > 0 && Math.floor(state.time * 24) % 2 === 0;
  if (!blinking && !fading) {
    drawNandini(bctx, p.x, p.y, p.facing, {
      runPhase: p.runPhase,
      grounded: p.grounded,
      rising: p.vy < 0,
      hurtFlash: p.invuln > 0,
      speed: Math.abs(p.vx),
      idleTime: p.idleTime,
      time: state.time,
      victory: state.mode === 'win' || state.mode === 'clear',
    });
  }
  bctx.restore();

  if (state.mode !== 'dead') drawHUDIcons();
  overlayPanels();

  blitBuffer();
  textSpace();

  if (state.mode !== 'dead') drawHUDText();
  overlayText();

  if (Sound.muted) txt('MUTED (M)', VIEW.w - 16, VIEW.h - 14, 8, 'rgba(255,255,255,0.6)', 'right');
}

/* --------------------------------------------------------------- game loop */

function handleMenuKeys() {
  if (Input.wasPressed('KeyM')) Sound.toggleMute();

  if (state.mode === 'title') {
    if (Input.wasPressed('Enter')) { Sound.unlock(); state.coinsTotal = 0; startLevel(0); }
    for (let i = 0; i < state.unlocked && i < LEVELS.length; i++) {
      if (Input.wasPressed(`Digit${i + 1}`)) { Sound.unlock(); state.coinsTotal = 0; startLevel(i); }
    }
  } else if (state.mode === 'dead') {
    if (Input.wasPressed('ArrowUp') || Input.wasPressed('KeyW')) state.menuIndex = 0;
    if (Input.wasPressed('ArrowDown') || Input.wasPressed('KeyS')) state.menuIndex = 1;
    const retry = () => { state.coinsTotal -= state.coinsThisLevel; startLevel(state.levelIndex); };
    if (Input.wasPressed('KeyR')) retry();
    else if (Input.wasPressed('Escape')) setMode('title');
    else if (Input.wasPressed('Enter') || Input.wasPressed('Space')) {
      if (state.menuIndex === 0) retry();
      else setMode('title');
    }
  } else if (state.mode === 'clear') {
    if (Input.wasPressed('Enter') && state.modeTime > 0.4) startLevel(state.levelIndex + 1);
  } else if (state.mode === 'win') {
    if (Input.wasPressed('Enter') && state.modeTime > 1.2) setMode('title');
  } else if (state.mode === 'play' || state.mode === 'intro') {
    if (Input.wasPressed('KeyR')) { state.coinsTotal -= state.coinsThisLevel; startLevel(state.levelIndex); }
    if (Input.wasPressed('Escape')) setMode('title');
  }
}

let lastTime = performance.now();
let accumulator = 0;
const STEP = 1 / 120;

function frame(now) {
  // Clamp to >= 0: the first rAF timestamp can predate the performance.now()
  // captured at load, and a negative delta would run the physics backwards.
  const raw = clamp((now - lastTime) / 1000, 0, 0.1);
  lastTime = now;
  state.time += raw;
  state.modeTime += raw;

  handleMenuKeys();

  if (state.mode === 'intro' && state.modeTime > 0.35) setMode('play');

  if (state.level) {
    accumulator += raw;
    let guard = 0;
    while (accumulator >= STEP && guard++ < 8) {
      if (state.mode === 'play') updatePlay(STEP);
      accumulator -= STEP;
    }
    if (accumulator > STEP) accumulator = 0;

    updateParticles(raw);
    state.shake = Math.max(0, state.shake - raw * 28);

    const { tx, ty } = centerCamera(false);
    const k = 1 - Math.pow(0.0006, raw);
    state.cam.x += (tx - state.cam.x) * k;
    state.cam.y += (ty - state.cam.y) * k;
  }

  Input.endFrame();
  render();
  requestAnimationFrame(frame);
}

/* ------------------------------------------------------------------- start */

loadProgress();
layout();
window.addEventListener('resize', layout);
window.addEventListener('orientationchange', layout);
PORTRAIT_PHONE.addEventListener('change', layout);
Input.bindTouch(document.getElementById('btn-left'), 'left');
Input.bindTouch(document.getElementById('btn-right'), 'right');
Input.bindTouch(document.getElementById('btn-jump'), 'jump');
canvas.addEventListener('pointerdown', () => {
  Sound.unlock();
  if (state.mode === 'title') { state.coinsTotal = 0; startLevel(0); }
  else if (state.mode === 'dead') { state.coinsTotal -= state.coinsThisLevel; startLevel(state.levelIndex); }
  else if (state.mode === 'clear' && state.modeTime > 0.4) startLevel(state.levelIndex + 1);
  else if (state.mode === 'win' && state.modeTime > 1.2) setMode('title');
});
requestAnimationFrame(frame);
</script>
